name: Android build and tests

on:
  pull_request:
    paths:
      - "ZholdasAndroid/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "ZholdasAndroid/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ZholdasAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ZholdasAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: ZholdasAndroid/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

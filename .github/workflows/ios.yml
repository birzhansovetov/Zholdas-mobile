name: iOS build, tests and TestFlight

on:
  push:
    branches: ["**"]
    paths:
      - "Zholdas/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Zholdas/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload this build to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Zholdas/Zholdas.xcodeproj
  SCHEME: Zholdas
  TEAM_ID: YFQ2H65ZA7

jobs:
  build-and-test:
    name: Build, test, screenshot (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k),
                            key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")])
          for rt in reversed(runtimes):
              phones = [d for d in devices[rt] if d["name"].startswith("iPhone")]
              phones.sort(key=lambda d: "Pro" not in d["name"])
              if phones:
                  print(phones[0]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator found"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and run tests
        run: |
          mkdir -p build
          STATUS=0
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild-test.log 2>&1 || STATUS=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" build/xcodebuild-test.log || true
          [ "$STATUS" -eq 0 ] || { tail -80 build/xcodebuild-test.log; exit "$STATUS"; }

      - name: Launch app and take screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          APP=$(find build/DerivedData/Build/Products -name "Zholdas.app" -path "*iphonesimulator*" | head -1)
          [ -n "$APP" ] || { echo "App was not built"; exit 0; }
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location app.zholdas.Zholdas || true
          xcrun simctl launch "$UDID" app.zholdas.Zholdas
          sleep 12
          xcrun simctl io "$UDID" screenshot build/screenshots/launch.png
          # Screenshots attached by UI tests
          xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots/ui-tests || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload test results and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/Tests.xcresult
            build/xcodebuild-test.log
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: build-and-test
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Add ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID secrets (see AGENTS.md)"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          KEY_FILE="$RUNNER_TEMP/asc/AuthKey.p8"
          # Normalize the key: secrets pasted from a phone often lose line breaks
          # or the BEGIN/END lines. Also accept a base64-encoded .p8 file.
          strip_pem() { sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' | tr -d ' \t\r\n"'; }
          RAW=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          if ! printf '%s' "$RAW" | grep -q "BEGIN PRIVATE KEY"; then
            DECODED=$(printf '%s' "$RAW" | tr -d ' \t\n' | base64 -D 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q "BEGIN PRIVATE KEY"; then RAW="$DECODED"; fi
          fi
          BODY=$(printf '%s' "$RAW" | strip_pem)
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid .p8 key (key body is ${#BODY} chars, expected ~200). Paste the full text of AuthKey_XXXX.p8 again."
            exit 1
          fi
          KEY_ID_TRIM=$(printf '%s' "$ASC_KEY_ID" | tr -d ' \t\r\n')
          ISSUER_TRIM=$(printf '%s' "$ASC_ISSUER_ID" | tr -d ' \t\r\n')
          [ ${#KEY_ID_TRIM} -eq 10 ] || echo "::warning::ASC_KEY_ID should be 10 characters, got ${#KEY_ID_TRIM}"
          [ ${#ISSUER_TRIM} -eq 36 ] || echo "::warning::ASC_ISSUER_ID should be a 36-character UUID, got ${#ISSUER_TRIM}"
          echo "ASC_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID_CLEAN=$KEY_ID_TRIM" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID_CLEAN=$ISSUER_TRIM" >> "$GITHUB_ENV"

      - name: Archive (signed via App Store Connect API key)
        run: |
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "Build number: $BUILD_NUMBER"
          STATUS=0
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Zholdas.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_CLEAN" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO \
            > build-archive.log 2>&1 || STATUS=$?
          grep -E "error:|\*\* ARCHIVE" build-archive.log || true
          [ "$STATUS" -eq 0 ] || { tail -80 build-archive.log; exit "$STATUS"; }

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Zholdas.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_CLEAN"
          echo "Uploaded. The build appears in TestFlight after Apple finishes processing (usually 5–20 min)."

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log
          path: build-archive.log
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
